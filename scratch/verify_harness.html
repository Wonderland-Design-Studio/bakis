
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <iframe id="frame" src="http://127.0.0.1:8080/" style="width: 100%; height: 900px;"></iframe>
  <script>
    window.addEventListener('message', () => {});
    const frame = document.getElementById('frame');
    frame.onload = () => {
      setTimeout(() => {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const win = frame.contentWindow;
        const results = [];

        // Test 1: Hero headline presence and content
        const headline = doc.querySelector('.hero-headline');
        if (headline) {
          results.push('PASS: Hero headline found: "' + headline.textContent.trim().replace(/\s+/g, ' ') + '"');
          results.push('Hero headline scrollWidth: ' + headline.scrollWidth + ' clientWidth: ' + headline.clientWidth);
        } else {
          results.push('FAIL: Hero headline not found');
        }

        // Test 2: Full Tension Joints modal
        win.openProductModal('distribution-boards');
        const modalImg = doc.getElementById('productModalImage');
        results.push('Full Tension Joints modal image: ' + (modalImg ? modalImg.getAttribute('src') : 'none'));

        // Test 3: Insulators & Substation Equipment modal
        win.openProductModal('insulators-substation');
        const imgWrap = doc.querySelector('.product-modal-image-wrap');
        const imgs = imgWrap ? Array.from(imgWrap.querySelectorAll('img')).map(img => img.getAttribute('src')) : [];
        results.push('Insulators modal images count: ' + imgs.length + ' -> ' + JSON.stringify(imgs));

        // Test 4: Surge Arrestor modal
        win.openProductModal('surge-arrestors');
        const surgeImg = doc.getElementById('productModalImage');
        results.push('Surge Arrestor modal image: ' + (surgeImg ? surgeImg.getAttribute('src') : 'none'));

        // Test 5: Aerial Bundled Conductor Accessories modal
        win.openProductModal('ipc-connectors');
        const modalTitle = doc.getElementById('productModalTitle');
        const subCards = doc.querySelectorAll('.abc-subproduct-card');
        results.push('ABC Modal Title: ' + (modalTitle ? modalTitle.textContent : 'none'));
        results.push('ABC Sub-products count: ' + subCards.length);
        const cardTitles = Array.from(subCards).map(c => c.querySelector('.abc-subproduct-title')?.textContent.trim());
        results.push('ABC Sub-products: ' + JSON.stringify(cardTitles));

        const pre = document.createElement('pre');
        pre.id = 'test-results';
        pre.textContent = JSON.stringify(results, null, 2);
        document.body.appendChild(pre);
      }, 600);
    };
  </script>
</body>
</html>
