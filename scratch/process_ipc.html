<!DOCTYPE html>
<html>
<head><title>Process IPC</title></head>
<body>
<canvas id="cv"></canvas>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const img = new Image();
  img.onload = () => {
    const cv = document.getElementById('cv');
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // Scan pixels and make light background transparent
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const minVal = Math.min(r, g, b);
      const maxVal = Math.max(r, g, b);
      const diff = maxVal - minVal;

      if (r > 215 && g > 215 && b > 215 && diff < 30) {
        const brightness = (r + g + b) / 3;
        if (brightness >= 240) {
          data[i + 3] = 0;
        } else {
          const factor = (240 - brightness) / 25;
          data[i + 3] = Math.max(0, Math.min(255, Math.round(255 * factor)));
        }
      }
    }

    ctx.putImageData(imgData, 0, 0);

    const dataUrl = cv.toDataURL('image/png');
    fetch('http://127.0.0.1:8089/save-png', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: dataUrl })
    })
    .then(r => r.text())
    .then(txt => {
      document.body.innerHTML = '<h1>' + txt + '</h1>';
    })
    .catch(err => {
      document.body.innerHTML = '<h1>Error: ' + err.message + '</h1>';
    });
  };
  img.src = 'assets/images/product-ipc-connector.jpg';
});
</script>
</body>
</html>
