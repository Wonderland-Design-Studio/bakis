<!DOCTYPE html>
<html>
<head><title>Clean Cutout IPC</title></head>
<body>
<canvas id="cv"></canvas>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const img = new Image();
  img.onload = () => {
    const cv = document.getElementById('cv');
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // Use flood-fill / BFS from borders to remove background without touching product internals
    const visited = new Uint8Array(w * h);
    const queue = [];

    // Push all border pixels to queue
    for (let x = 0; x < w; x++) {
      queue.push(x, 0);
      queue.push(x, h - 1);
      visited[0 * w + x] = 1;
      visited[(h - 1) * w + x] = 1;
    }
    for (let y = 0; y < h; y++) {
      queue.push(0, y);
      queue.push(w - 1, y);
      visited[y * w + 0] = 1;
      visited[y * w + (w - 1)] = 1;
    }

    // Helper to test if a pixel is background (near white / light gray)
    function isBg(idx) {
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];
      const minV = Math.min(r, g, b);
      const maxV = Math.max(r, g, b);
      // Background is light (> 195) and neutrally colored (low saturation)
      return minV > 190 && (maxV - minV) < 35;
    }

    let head = 0;
    while (head < queue.length) {
      const qx = queue[head++];
      const qy = queue[head++];
      const pIdx = (qy * w + qx) * 4;

      if (isBg(pIdx)) {
        // Mark pixel transparent
        data[pIdx + 3] = 0;

        // Check 4 neighbors
        const neighbors = [
          [qx + 1, qy],
          [qx - 1, qy],
          [qx, qy + 1],
          [qx, qy - 1]
        ];

        for (const [nx, ny] of neighbors) {
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            const nVisitedIdx = ny * w + nx;
            if (!visited[nVisitedIdx]) {
              visited[nVisitedIdx] = 1;
              const nPIdx = (ny * w + nx) * 4;
              if (isBg(nPIdx)) {
                queue.push(nx, ny);
              }
            }
          }
        }
      }
    }

    // Soften transition / feathered borders
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = (y * w + x) * 4;
        if (data[idx + 3] > 0) {
          const r = data[idx], g = data[idx + 1], b = data[idx + 2];
          if (r > 200 && g > 200 && b > 200) {
            // Count surrounding transparent pixels
            let transCount = 0;
            if (data[((y-1)*w + x)*4 + 3] === 0) transCount++;
            if (data[((y+1)*w + x)*4 + 3] === 0) transCount++;
            if (data[(y*w + x - 1)*4 + 3] === 0) transCount++;
            if (data[(y*w + x + 1)*4 + 3] === 0) transCount++;
            if (transCount >= 1) {
              data[idx + 3] = Math.max(0, 255 - transCount * 65);
            }
          }
        }
      }
    }

    ctx.putImageData(imgData, 0, 0);

    const dataUrl = cv.toDataURL('image/png');
    fetch('http://127.0.0.1:8089/save-png', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: dataUrl })
    })
    .then(r => r.text())
    .then(txt => {
      document.body.innerHTML = '<h1>' + txt + '</h1>';
    });
  };
  img.src = '/assets/images/product-ipc-connector.jpg';
});
</script>
</body>
</html>
